<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline · Booking</title>
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<header class="site-header">
    <div class="shell header-inner">
        <span class="brand"><span class="brand-mark" aria-hidden="true"></span> Booking</span>
    </div>
</header>
<main class="shell">
    <section class="panel">
        <p class="eyebrow">Offline</p>
        <h1>You are not connected</h1>
        <p class="lede">
            This page cannot be loaded while the device is offline. Nothing has been submitted,
            and no booking has been created.
        </p>
        <p class="muted">Reconnect to the internet and reload the page to continue.</p>
        <p><a class="button" href="/">Try again</a></p>
    </section>
</main>
</body>
</html>

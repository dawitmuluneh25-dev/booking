name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    # The Feature suite is the half of the suite that proves the reservation guard, the
    # migration invariants and the referral transactions. Without a database those tests
    # call markTestSkipped() and the build reports success having run none of them.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: booking_app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # fileinfo is required by DocumentStorageTest: without it that test skips, and a
          # skipped test is a failed build here.
          extensions: pdo, pdo_mysql, mbstring, json, openssl, fileinfo
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure environment
        run: |
          cp .env.example .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_NAME=.*/DB_NAME=booking_app/' .env
          sed -i 's/^DB_USER=.*/DB_USER=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env

      - name: Wait for MySQL
        run: |
          for attempt in $(seq 1 30); do
            if mysqladmin ping --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL is accepting connections after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become reachable." >&2
          exit 1

      - name: Apply migrations
        run: php bin/console migrate

      - name: Assert every migration is applied and its checksum matches
        run: |
          php bin/console migrate:status | awk '
            NR > 1 && NF >= 4 && ($3 != "yes" || $4 != "ok") {
              print "not applied or drifted: " $0
              bad = 1
            }
            END { exit bad }'

      - name: Code style
        run: composer cs

      - name: Static analysis
        run: composer stan

      # Runs here rather than through `composer check` so the suite can fail on a skip.
      # A skipped test in CI means a capability is unproven, and an unproven capability
      # must not carry a green build.
      - name: Tests (a skipped test fails the build)
        run: composer test -- --fail-on-skipped
